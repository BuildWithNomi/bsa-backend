# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New + → Blueprint → pick this repo.
# Render creates the service, generates both JWT secrets, and asks for the
# values marked `sync: false` (DATABASE_URL + the first-admin credentials).
services:
  - type: web
    name: bsa-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/v1/health
    # The generated Prisma client is TypeScript, so the build must run with
    # devDependencies available. `npm ci` also triggers `prisma generate`.
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    # Migrations run before the server starts, so a fresh Neon database is
    # ready on the first boot. `prisma7.config.ts` also seeds the first admin.
    startCommand: npm run prisma:deploy && node dist/main
    envVars:
      - key: NODE_ENV
        value: production

      # Neon pooled connection string (postgresql://...?sslmode=require)
      - key: DATABASE_URL
        sync: false

      # Generated once by Render; the app refuses to boot if they match or are short.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_ACCESS_TTL
        value: "900"
      - key: JWT_REFRESH_TTL
        value: "2592000"
      - key: BCRYPT_ROUNDS
        value: "12"

      # First administrator — read only by the seed step after migrations.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: Administrator
